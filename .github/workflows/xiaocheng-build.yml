name: Build Xiaocheng firmware

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xiaocheng-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  host:
    name: Xiaocheng ESP32-S3 Host
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      IDF_PATH: ${{ github.workspace }}/.ci/esp-idf
      IDF_CCACHE_ENABLE: '1'
      # firmware_artifacts.py collect verifies the embedded release
      # configuration against these values; the host string must be non-empty.
      MICROPIXEL_REMOTE_CONTROL_HOST: quic.micropixel.ai
      MICROPIXEL_REMOTE_CONTROL_PORT: '8443'
      MICROPIXEL_REMOTE_CONTROL_ALLOW_UNVERIFIED_TLS: 'y'
      MICROPIXEL_REMOTE_CONTROL_TRUSTED_CA_DER_BASE64: ''
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive
      - name: Read fixed ESP-IDF revision
        run: echo "IDF_REVISION=$(python3 -c 'import json; print(json.load(open("tools/ci/firmware-sources.json"))["esp_idf_commit"])')" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: espressif/esp-idf
          ref: ${{ env.IDF_REVISION }}
          path: .ci/esp-idf
          submodules: recursive
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.espressif
          key: idf-linux-esp32s3-xiaocheng-${{ env.IDF_REVISION }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/ccache
          key: ccache-xiaocheng-${{ env.IDF_REVISION }}-${{ github.sha }}
          restore-keys: ccache-xiaocheng-${{ env.IDF_REVISION }}-
      - name: Install fixed IDF tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ninja-build ccache libusb-1.0-0 python3-venv
          "$IDF_PATH/install.sh" esp32s3
      - name: Compile Xiaocheng board firmware
        run: bash tools/s3.sh build-host xiaocheng
      - name: Collect flashable artifacts
        run: python3 tools/ci/firmware_artifacts.py collect --profile xiaocheng-esp32s3 --output build/ci-host/xiaocheng-esp32s3
      - name: Download the App Bundles that seed the on-device store
        # Prebuilt bundles from the public micropixel.ai store API; no WASI
        # SDK and no wamrc are involved.
        run: python3 tools/fetch_store_apps.py --manifest apps/store-seed.json --output store-apps
      - name: Build the seeded app store image
        run: |
          set -euo pipefail
          python3 tools/build_app_store_image.py --app-store-size '0x0800000' \
            --output build/ci-host/xiaocheng-esp32s3/app-store.bin store-apps/*.bundle.bin
          # The store lives at 0x800000 and is 8 MiB; a longer image would be
          # rejected by the full-image builder.
          test "$(stat -c %s build/ci-host/xiaocheng-esp32s3/app-store.bin)" -le 8388608
      - name: Build the full single-image firmware (flash from 0x0)
        run: |
          set -euo pipefail
          python3 tools/build_full_firmware_image.py \
            --build-dir build/host-esp32s3-xiaocheng \
            --app-store-image build/ci-host/xiaocheng-esp32s3/app-store.bin \
            --output build/ci-host/xiaocheng-esp32s3/micropixel-full.bin
          python3 - <<'PY'
          import json
          import pathlib
          import struct

          image = pathlib.Path('build/ci-host/xiaocheng-esp32s3/micropixel-full.bin').read_bytes()
          app = pathlib.Path('build/ci-host/xiaocheng-esp32s3/micropixel.bin').read_bytes()
          app_offset = int(json.loads(pathlib.Path('build/ci-host/xiaocheng-esp32s3/flasher_args.json').read_text())['app']['offset'], 0)
          assert image[:1] == b'\xe9' or image[app_offset:app_offset + 1] == b'\xe9', 'no app image found'
          assert image[app_offset:app_offset + len(app)] == app, 'embedded app image mismatch'
          assert struct.unpack_from('<H', image, 0x8000)[0] == 0x50AA, 'partition table missing'
          print(f'full image ok: {len(image)} bytes, app image embedded at {hex(app_offset)}')
          PY
      - name: Save IDF tool cache
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.espressif
          key: idf-linux-esp32s3-xiaocheng-${{ env.IDF_REVISION }}
      - name: Save compiler cache
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/ccache
          key: ccache-xiaocheng-${{ env.IDF_REVISION }}-${{ github.sha }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: xiaocheng-firmware
          path: build/ci-host/xiaocheng-esp32s3/
          retention-days: 30
